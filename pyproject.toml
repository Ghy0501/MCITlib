[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcitlib"
version = "0.1.0"
description = "MCITlib continual multimodal instruction tuning library"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "MCITlib authors"}]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# Torch 2.0's extension loader still imports pkg_resources, removed by newer releases.
dev = ["pytest>=7.4", "ruff>=0.6", "build>=1", "setuptools>=68,<81", "wheel>=0.41"]

[project.scripts]
mcitlib = "mcitlib.cli:main"

[tool.setuptools]
# Make the project root an editable import path. This also prevents the
# outer project directory from shadowing its same-named package as a namespace.
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["mcitlib", "mcitlib.*"]

[tool.setuptools.package-data]
"mcitlib.backbones.internvl.intern_vit" = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "env: required runtime environment (llava, llava-t437, or llava-modalprompt-ds126)",
  "entrypoints: starts real subprocesses for every generated entry point (needs the full environment)",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# imports are ordered on purpose: `import mcitlib` must run before `import peft`.
"tests/equivalence/_adapter_roundtrip_harness.py" = ["I"]
# These files intentionally retain upstream implementation style while imports
# and ownership boundaries are migrated; new adapter code remains fully linted.
"mcitlib/backbones/llava/standard_train.py" = ["E", "F", "I"]
"mcitlib/backbones/llava/moe_train.py" = ["E", "F", "I"]
"mcitlib/backbones/llava/trainer.py" = ["E", "F", "I"]
"mcitlib/backbones/internvl/intern_vit/*.py" = ["E", "F", "I"]
"mcitlib/tuners/mcit_expert_lora.py" = ["E", "F", "I"]
"mcitlib/tuners/mcit_separable_expert_lora.py" = ["E", "F", "I"]
"mcitlib/methods/_hide/llava_overrides/**/*.py" = ["E", "F", "I"]
"mcitlib/methods/_disco/llava_overrides/**/*.py" = ["E", "F", "I"]
"mcitlib/methods/_modalprompt/llava_overrides/**/*.py" = ["E", "F", "I"]
"mcitlib/methods/_sefe/llava_overrides/**/*.py" = ["E", "F", "I"]
"mcitlib/methods/_keeplora/llava_overrides/**/*.py" = ["E", "F", "I"]
"mcitlib/backbones/llava/snapshots/dcda07fb/**/*.py" = ["E", "F", "I"]
"mcitlib/backbones/llava/eval_runners/coin/*.py" = ["E", "F", "I"]
"mcitlib/backbones/llava/eval_runners/general_model_vqa*.py" = ["E", "F", "I"]
"mcitlib/methods/_*/eval_runners/*.py" = ["E", "F", "I"]
"mcitlib/methods/_mrlora/router_results/*.py" = ["E", "F", "I"]
