name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install '.[dev]'
      - run: ruff check mcitlib tools tests

  test-llava:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install '.[dev]'
      - run: python -m pip install torch==2.0.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install transformers==4.31.0
      - run: python -m pytest -q

  test-llava-t437:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install '.[dev]'
      - run: python -m pip install torch==2.0.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install transformers==4.37.2
      - run: python -m pytest -q -m env

  spdx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/add_spdx.py --check

  third-party:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/check_third_party.py
