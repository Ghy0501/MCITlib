          gpu_num: 2
          prefix_len: 10
          num_tasks: 6
          epoch: 10
          batch_size: 16
          grad_acc: 1
          lr: 0.0002
        eval_config:
          gpu_num: 2
          result_path: ./results/UCIT/each_dataset
          text_tower: ${model_root}/clip-vit-large-patch14-336
          prefix_len: 10
          num_tasks: 6
