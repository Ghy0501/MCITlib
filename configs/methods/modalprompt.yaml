format: mcitlib-method-v1
id: modalprompt
v3_dir: ModalPrompt
environment: llava
train_entry: standard
deepspeed_config: zero3_offload
separate_train_and_infer: true
source_metadata:
  mllm_acl:
    sequence_repairs:
    - 1
    - 2
    - 3
    - 4
overrides:
  llava:
    ucit:
