source_metadata:
  ucit:
    sequence_repairs: []
    path_placeholders:
      /home/hongbo_zhao/ghy-cl-codebase/clip-vit-large-patch14-336: /your_model_path/clip-vit-large-patch14-336
      /home/hongbo_zhao/ghy-cl-codebase/MCITlib/checkpoints: /your_ckpts_path
      /home/hongbo_zhao/ghy-cl-codebase/MCITlib: /your_path/MCITlib_v3
      /mnt/cache/guohaiyang/miniconda3/envs/coin/bin/python: /your_python_path
    config_aliases: {}
  mllm_dcl:
    sequence_repairs: []
    path_placeholders:
      /home/hongbo_zhao/ghy-cl-codebase/clip-vit-large-patch14-336: /your_model_path/clip-vit-large-patch14-336
      /home/hongbo_zhao/ghy-cl-codebase/MCITlib/checkpoints: /your_ckpts_path
      /home/hongbo_zhao/ghy-cl-codebase/MCITlib: /your_path/MCITlib_v3
      /mnt/cache/guohaiyang/miniconda3/envs/coin/bin/python: /your_python_path
    config_aliases: {}
  mllm_acl:
    sequence_repairs:
    - 1
    - 2
    - 3
    - 4
    path_placeholders:
      /home/hongbo_zhao/ghy-cl-codebase/clip-vit-large-patch14-336: /your_model_path/clip-vit-large-patch14-336
      /home/hongbo_zhao/ghy-cl-codebase/MCITlib/checkpoints: /your_ckpts_path
      /home/hongbo_zhao/ghy-cl-codebase/MCITlib: /your_path/MCITlib_v3
      /mnt/cache/guohaiyang/miniconda3/envs/coin/bin/python: /your_python_path
    config_aliases: {}
overrides:
  llava:
    ucit:
      task_1:
        task_id: 1
        task_name: ImageNet-R
        model_config:
          model_name: ${model_root}/llava-v1.5-7b
          mm_projector: ${model_root}/llava-v1.5-7b/mm_projector.bin
          vision_tower: ${model_root}/clip-vit-large-patch14-336
        source:
          model_config: model_configs/llava.json
          data_config: data_configs/UCIT/ImageNet-R.json
          train_config: train_configs/ModalPrompt/LLaVA/UCIT/train/task1.json
          eval_config: train_configs/ModalPrompt/LLaVA/UCIT/eval/task1.json
        data_config:
          train_path: ${data_root}/UCIT/ImageNet-R/train.json
          test_path: ${data_root}/UCIT/ImageNet-R/test_3000.json
          train_folder: ${data_root}/UCIT
          test_folder: ${data_root}/UCIT
        train_config:
          gpu_num: 2
          output_dir: ${ckpt_root}/UCIT/LLaVA/ModalPrompt/Task1_llava
          prefix_len: 10
          num_tasks: 6
          cur_task: 1
          epoch: 10
          batch_size: 16
          grad_acc: 1
          lr: 0.0002
        eval_config:
          gpu_num: 2
          stage: ModalPrompt-task1
          model_path: ${ckpt_root}/UCIT/LLaVA/ModalPrompt/Task1_llava
          result_path: ./results/UCIT/each_dataset
          text_tower: ${model_root}/clip-vit-large-patch14-336
          prefix_len: 10
          cur_task: 1
          num_tasks: 6
        train_command:
          argv:
          - deepspeed
          - --include
          - localhost:0,1
          - --master_port
          - '9001'
          - llava/train/train_mem.py
          - --deepspeed
          - ./scripts/zero3_offload.json
          - --lora_enable
          - 'False'
          - --mm_projector_lr
          - 2e-5
          - --pt_enable
          - 'True'
          - --model_name_or_path
          - ${model_root}/llava-v1.5-7b
          - --pretrain_mm_mlp_adapter
          - ${model_root}/llava-v1.5-7b/mm_projector.bin
          - --version
          - v1
          - --data_path
          - ${data_root}/UCIT/ImageNet-R/train.json
          - --image_folder
          - ${data_root}/UCIT
          - --vision_tower
          - ${model_root}/clip-vit-large-patch14-336
          - --text_tower
          - ${model_root}/clip-vit-large-patch14-336
          - --mm_projector_type
          - mlp2x_gelu
