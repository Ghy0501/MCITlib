format: mcitlib-method-v1
id: replay
v3_dir: Replay
environment: llava
train_entry: standard
deepspeed_config: zero2
separate_train_and_infer: false
source_metadata: {}
overrides:
  llava:
    ucit:
      task_defaults:
        train_config:
          gpu_num: 2
          rank: 16
          epoch: 1
          batch_size: 16
          grad_acc: 2
          lr: 0.0002
        eval_config:
          gpu_num: 2
          result_path: ./results/UCIT/each_dataset
      task_1:
        data_config:
          replay_path: /your_data_path/UCIT/ImageNet-R/replay.json
          router_folder: /your_data_path/UCIT
        train_config:
          output_dir: ${ckpt_root}/MCITlib/UCIT/LLaVA/Replay/Task1_llava_lora
        eval_config:
          stage: LoRA-task1
          model_path: ${ckpt_root}/MCITlib/UCIT/LLaVA/Replay/Task1_llava_lora
        train_command: {template: train_train_mem_3, set: {--lora_alpha: '32', --data_path: '@{task.data_config.train_folder}/@{task.task_name}/@{method.id}.json'},
          kind: train, order: 1}
        eval_commands:
        - {template: eval_model_others_1, kind: eval, order: 3, env: {CUDA_VISIBLE_DEVICES: '1'}}
        - {template: eval_model_others_1, set: {--answers-file: '@{task.eval_config.result_path}/@{task.task_name}/@{task.eval_config.stage}/2_0.jsonl',
