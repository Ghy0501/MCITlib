          model_path: ${ckpt_root}/MCITlib/UCIT/LLaVA/RegLoRA/Task1_llava_lora_merged
        removed_install_commands:
        - - pip
          - install
          - -e
          - .
        - - pip
          - install
          - transformers==4.37.2
        train_command: {template: train_train_mem_7, set: {--lora_alpha: '32'}, kind: train, order: 2}
        eval_commands:
        - {template: eval_model_others_3, set: {--answers-file: '@{task.eval_config.result_path}/@{task.task_name}/@{task.eval_config.stage}/2_0.jsonl',
            --chunk-idx: '0'}, kind: eval, order: 7}
        - {template: eval_model_others_3, kind: eval, order: 8}
