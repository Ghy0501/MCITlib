    model_max_length: '2048'
    per_device_eval_batch_size: '16'
    report_to: none
    save_steps: '50000'
    save_strategy: steps
    tf32: 'True'
    version: v1
    vision_tower: ${model_root}/clip-vit-large-patch14-336
    warmup_ratio: '0.03'
    weight_decay: '0.'
